server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Tune for static assets
    location ~* \.(jpg|jpeg|png|gif|css|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Disable access log for health checks (optional, reduces noise)
    access_log /var/log/nginx/access.log combined;
}